plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.orbitopenrouterloopback'
version = '0.1.0'

android {
  namespace "expo.modules.orbitopenrouterloopback"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      includeAndroidResources = false
    }
  }
  sourceSets {
    test {
      java.srcDirs += 'src/test/java'
    }
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
}
