# This repository is a trusted local development workspace. The profile grants
# broad access to this repo, its Git metadata, and the public internet without
# expanding the default sandbox boundary to the rest of the machine.
approval_policy = "never"
default_permissions = "orbit-local"

[features]
network_proxy = true

[permissions.orbit-local]
description = "Autonomous development inside orbit-app, including local commits."
extends = ":workspace"

[permissions.orbit-local.filesystem]
":root" = "deny"
":minimal" = "read"
"/home/bwales/.codex/packages/standalone" = "read"

[permissions.orbit-local.filesystem.":workspace_roots"]
".git" = "write"

[permissions.orbit-local.network]
enabled = true

[permissions.orbit-local.network.domains]
"*" = "allow"
